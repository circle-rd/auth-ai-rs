name: Release — crates.io

# Creating a GitHub release publishes the crate: the release (and its tag
# vX.Y.Z) is the single trigger. Create it from `main` once the version is set
# in Cargo.toml. This workflow never creates a release or a tag itself.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/auth-ai
    permissions:
      contents: read
      # TODO(release): restore once auth-ai exists on crates.io. Trusted Publishing
      # cannot bootstrap the first version, so the API token is used until then.
      # id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Check the release against Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(sed -n -E '0,/^version = "(.*)"/s//\1/p' Cargo.toml)
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::The release tag is '${TAG}' but Cargo.toml says '${version}'. Set the version on main, then create the release again."
            exit 1
          fi
          # SemVer pre-releases carry a hyphen (X.Y.Z-rc.1, X.Y.Z-dev.202611180930).
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if [ "$IS_PRERELEASE" != "$prerelease" ]; then
            echo "::error::Version ${version} must be published as a pre-release=${prerelease} release."
            exit 1
          fi
          if [ "$prerelease" = false ]; then
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::A stable release must be created from a commit on main."
              exit 1
            }
          fi

      # TODO(release): restore Trusted Publishing once auth-ai exists on crates.io:
      # - uses: rust-lang/crates-io-auth-action@v1
      #   id: auth

      - name: Publish
        env:
          # TODO(release): switch back to ${{ steps.auth.outputs.token }}.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
